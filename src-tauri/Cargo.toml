[package]
name = "pagle-companion"
version = "0.1.0"
description = "Pagle Companion: carries Pagle data between the game's files and the backend"
license = "MIT"
repository = "https://github.com/timemir/pagle-companion"
edition = "2024"
rust-version = "1.89"

[lib]
name = "pagle_companion_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
log = { version = "0.4", features = ["std"] }
humantime = "2"
dirs = "7"
flate2 = "1"
crc32fast = "1"
dunce = "1"
notify = "8"
tauri-plugin-dialog = "2"
http = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
sha2 = "0.11"
# 2.13 and later need Tauri 2.12; stay on the Tauri this app is built with.
# Only its configuration and latest.json types are used, so no zip support.
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["rustls-tls"] }
# The plugin's own verifier, called directly so headless mode can use it
# (DST-R53).
minisign-verify = "0.3"
semver = "1"
base64 = "0.23"
ring = "0.17.14"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
libc = "0.2"
zbus = "5"
# Tray mode quits on SIGTERM and SIGHUP (CMP-R92).
tokio = { version = "1", features = ["signal"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
minisign = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
