# Tester builds (DST-R48): started by hand on any branch, both packages as
# this run's artifacts only. No updater signatures, never attached to a
# Release, named in latest.json or advertised.
name: Test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        # <latest Release's version with PATCH + 1>-test.<run number>, or
        # 0.0.1-test.<run number> before the first Release.
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$latest" ]; then
            base=0.0.1
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            base="$major.$minor.$((patch + 1))"
          fi
          echo "version=$base-test.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          # ubuntu-22.04 is the Linux build runner and floor (DST Tunables).
          - os: ubuntu-22.04
            bundle: appimage
            artifact: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci --ignore-scripts

      # The version reaches the script through the environment, never pasted
      # into it, and jq writes the JSON.
      - name: Write the tester overlay
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p ci
          jq -n --arg version "$VERSION" \
            '{version: $version, bundle: {createUpdaterArtifacts: false}}' > ci/test-build.conf.json

      - name: Build
        env:
          BUNDLE: ${{ matrix.bundle }}
        shell: bash
        run: npx tauri build --config ci/test-build.conf.json --bundles "$BUNDLE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pagle-companion-${{ needs.version.outputs.version }}-${{ matrix.bundle }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
