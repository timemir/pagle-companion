# Tester builds (DST-R48): started by hand on any branch, both packages as
# this run's artifacts only. No updater signatures, never attached to a
# Release, named in latest.json or advertised.
name: Test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        # <latest Release's version with PATCH + 1>-test.<run number>, or
        # 0.0.1-test.<run number> before the first Release.
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$latest" ]; then
            base=0.0.1
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            base="$major.$minor.$((patch + 1))"
          fi
          echo "version=$base-test.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          # ubuntu-22.04 is the Linux build runner and floor (DST Tunables).
          - os: ubuntu-22.04
            bundle: appimage
            artifact: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Write the tester overlay
        shell: bash
        run: |
          mkdir -p ci
          cat > ci/test-build.conf.json <<JSON
          {
            "version": "${{ needs.version.outputs.version }}",
            "bundle": { "createUpdaterArtifacts": false }
          }
          JSON

      - name: Build
        run: npx tauri build --config ci/test-build.conf.json --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: pagle-companion-${{ needs.version.outputs.version }}-${{ matrix.bundle }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
