# Pull requests for dependency updates. Security updates come as soon as an
# advisory is published, whatever the schedule; version updates weekly,
# grouped so they arrive as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
    ignore:
      # zbus 6 drops the blocking API the Secret Service store is built on;
      # moving to it is #45.
      - dependency-name: zbus
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  # Keeps the commit SHAs the workflows pin their actions to current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
