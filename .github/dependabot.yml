# Pull requests for dependency updates. Security updates come as soon as an
# advisory is published, whatever the schedule; version updates weekly,
# grouped so they arrive as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
    ignore:
      # notify-rust and Tauri's opener and single-instance plugins still need
      # zbus 5, so moving the Secret Service store to 6 alone would add a
      # second D-Bus stack, not drop zbus 5 (#45). Lift this once they move.
      - dependency-name: zbus
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']

  # Keeps the commit SHAs the workflows pin their actions to current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
